name: Import project package
on:
  push:
    branches: [main]
    paths: ['.github/import/READY']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wali-package-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'Eljah/wali'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Restore and verify exact original project files
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .github/import
        run: python3 .github/import/restore.py
      - name: Publish verified project without force-push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Import all 316 original wali R02 project files with integrity verification'
            git push origin HEAD:main
          fi
          echo "Published commit: $(git rev-parse HEAD)"
