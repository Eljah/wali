name: Import project package
on:
  push:
    branches: [main]
    paths: ['.github/import/READY']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wali-package-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'Eljah/wali'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - name: Restore and verify project files
        run: python3 .github/import/restore.py
      - name: Publish imported files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete UBOR-JAVA R02 project'
            git push origin HEAD:main
          fi
