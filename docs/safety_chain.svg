<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#247477"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans" fill="#163A45">
<text x="30" y="40" font-size="27" font-weight="bold">UBOR-JAVA R01 / аппаратное разрешение и повторный пуск</text>
<rect x="30" y="100" width="370" height="110" rx="8" fill="#EEF4F4" stroke="#247477" stroke-width="2"/>
<text x="215.0" y="131.0" text-anchor="middle" font-size="25.0" font-weight="bold">TPS3431</text>
<text x="215.0" y="163.0" text-anchor="middle" font-size="22.9" font-weight="normal">WDI от завершённого цикла</text>
<text x="215.0" y="195.0" text-anchor="middle" font-size="25.0" font-weight="normal">WD_OK, ~200 мс</text>
<rect x="495" y="100" width="420" height="110" rx="8" fill="#EEF4F4" stroke="#247477" stroke-width="2"/>
<text x="705.0" y="147.0" text-anchor="middle" font-size="25.0" font-weight="bold">NC-цепь</text>
<text x="705.0" y="179.0" text-anchor="middle" font-size="24.9" font-weight="normal">E-stop / кожух / бампер / край</text>
<rect x="1010" y="90" width="360" height="140" rx="8" fill="#EEF4F4" stroke="#247477" stroke-width="2"/>
<text x="1190.0" y="136.0" text-anchor="middle" font-size="25.0" font-weight="bold">SN74LVC1G74</text>
<text x="1190.0" y="168.0" text-anchor="middle" font-size="25.0" font-weight="normal">nCLR ← CLEAR_N</text>
<text x="1190.0" y="200.0" text-anchor="middle" font-size="25.0" font-weight="normal">D = 1, nPRE = 1</text>
<rect x="30" y="345" width="370" height="105" rx="8" fill="#EEF4F4" stroke="#247477" stroke-width="2"/>
<text x="215.0" y="389.5" text-anchor="middle" font-size="25.0" font-weight="bold">Кнопка ARM</text>
<text x="215.0" y="421.5" text-anchor="middle" font-size="25.0" font-weight="normal">новое ручное нажатие</text>
<rect x="495" y="345" width="420" height="105" rx="8" fill="#EEF4F4" stroke="#247477" stroke-width="2"/>
<text x="705.0" y="389.5" text-anchor="middle" font-size="25.0" font-weight="bold">RC + Schmitt</text>
<text x="705.0" y="421.5" text-anchor="middle" font-size="25.0" font-weight="normal">CLK: положительный фронт</text>
<rect x="1010" y="345" width="360" height="105" rx="8" fill="#EEF4F4" stroke="#247477" stroke-width="2"/>
<text x="1190.0" y="389.5" text-anchor="middle" font-size="25.0" font-weight="bold">Q = HW_ENABLE</text>
<text x="1190.0" y="421.5" text-anchor="middle" font-size="22.1" font-weight="normal">самопуска после сброса нет</text>
<rect x="30" y="590" width="530" height="120" rx="8" fill="#EEF4F4" stroke="#247477" stroke-width="2"/>
<text x="295.0" y="626.0" text-anchor="middle" font-size="25.0" font-weight="bold">HW_ENABLE AND SOFT_ARM</text>
<text x="295.0" y="658.0" text-anchor="middle" font-size="25.0" font-weight="normal">RUN_EN → nSLEEP</text>
<text x="295.0" y="690.0" text-anchor="middle" font-size="25.0" font-weight="normal">NOT RUN_EN → PWM OE</text>
<rect x="700" y="590" width="670" height="120" rx="8" fill="#EEF4F4" stroke="#247477" stroke-width="2"/>
<text x="1035.0" y="626.0" text-anchor="middle" font-size="25.0" font-weight="bold">HW_ENABLE → буфер 5 В → MOSFET</text>
<text x="1035.0" y="658.0" text-anchor="middle" font-size="25.0" font-weight="normal">Катушка K1 + второй NC полюс E-stop</text>
<text x="1035.0" y="690.0" text-anchor="middle" font-size="25.0" font-weight="normal">Разрыв питания моторной шины</text>
